<section class="login">
  <div class="tarjeta">
    <div class="icono">🔒</div>
    <h1>Iniciar sesión</h1>
    <p class="subtitulo">Introduce tus credenciales para continuar</p>

    <div class="campo">
      <label for="usuario">Usuario</label>
      <input
        id="usuario"
        type="text"
        placeholder="Tu usuario"
        autocomplete="username"
        #cajausuario
      />
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        placeholder="Tu contraseña"
        autocomplete="current-password"
        #cajapassword
        (keyup.enter)="validarUsuario()"
      />
    </div>

    <button type="button" (click)="validarUsuario()">Entrar</button>

    <p class="mensaje" *ngIf="mensaje">{{ mensaje }}</p>
  </div>
</section>
